info:
  name: Get Car Types
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/car-types?page=1&per_page=15"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "15"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: |-
  Return the available car types in the selected language.
  
  Query parameters (both optional):
  - `page` (integer): page number; defaults to 1.
  - `per_page` (integer): results per page; defaults to 15 and is clamped to 1–50.
  
  No request body or authentication is required. Each result contains `id` and localized `name`; pagination metadata is included.
