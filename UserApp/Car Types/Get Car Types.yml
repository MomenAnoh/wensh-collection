info:
  name: Get Car Types
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/car-types?page=1&per_page=15"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "15"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
