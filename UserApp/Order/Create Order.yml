docs: |-
  ## POST {{userUrl}}/order

  Create a service order for the authenticated user. The request body is JSON, and the user bearer token is required.

  ### Required body fields
  - `car_type_id` (integer): ID of an existing car type.
  - `from_address` (string, required): pickup address shown on the order card, up to 255 characters.
  - `from_latitude` (number): pickup latitude from -90 to 90.
  - `from_longitude` (number): pickup longitude from -180 to 180.
  - `to_address` (string, required): destination address shown on the order card, up to 255 characters.
  - `to_latitude` (number): destination latitude from -90 to 90.
  - `to_longitude` (number): destination longitude from -180 to 180.
  - `type` (string): `normal` or `scheduled`.
  - `payment_methods` (string, required): `cash` or `online`.
  - `price` (number): requested price, zero or greater.

  ### Conditional fields
  - `scheduled_day` (date): required when `type` is `scheduled`; must be today or a future date.
  - `scheduled_time` (string): required when `type` is `scheduled`; use 24-hour `HH:mm` format.

  For `cash`, the response returns the created order. For `online`, both statuses start as `pending_for_payed` and the response data contains only three temporary signed links: `payment_url` (GET page), `success_url` (POST callback), and `failure_url` (POST callback). They expire after 15 minutes. Success sets both statuses to `accepted`; failure returns both to `pending` and sends the order to drivers. The online response does not include the order resource.
