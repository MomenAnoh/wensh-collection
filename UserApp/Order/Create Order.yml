info:
  name: Create Order
  type: http
  seq: 1

http:
  method: POST
  url: "{{userUrl}}/order"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "car_type_id": 1,
        "from_latitude": 30.0444,
        "from_longitude": 31.2357,
        "to_latitude": 30.0131,
        "to_longitude": 31.2089,
        "type": "normal",
        "payment_methods": "cash",
        "price": 150
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/order"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
      body:
        type: json
        data: |-
          {
            "car_type_id": 1,
            "from_latitude": 30.0444,
            "from_longitude": 31.2357,
            "to_latitude": 30.0131,
            "to_longitude": 31.2089,
            "type": "normal",
            "payment_methods": ["cash"],
            "price": 150
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 14 Nov 2026 12:55:52 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "Order created successfully.",
            "data": {
              "id": 2,
              "car_type_id": 1,
              "from_latitude": 30.0444,
              "from_longitude": 31.2357,
              "to_latitude": 30.0131,
              "to_longitude": 31.2089,
              "type": "normal",
              "status": null,
              "scheduled_day": null,
              "scheduled_time": null,
              "payment_methods": [
                "cash"
              ],
