docs: |-
  Get the authenticated user's orders as paginated order cards. Requires the user bearer token.

  Query parameters:
  - `page` (integer, optional): page number; defaults to 1.
  - `per_page` (integer, optional): results per page; defaults to 15 and is limited to 1–50.
  - `filter` (string, optional): `current` (default), `scheduled`, or `previous`.

  Filters:
  - `current`: normal orders with `accepted` status, plus scheduled orders whose scheduled date and time have passed and are not completed or cancelled.
  - `scheduled`: scheduled orders that are not completed or cancelled.
  - `previous`: orders with `completed` or `cancelled` status.

  Each order card returns only `id`, `price`, `date`, `time`, `from_address`, and `to_address`. Results contain only orders owned by the authenticated user.
