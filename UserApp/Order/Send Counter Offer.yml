info:
  name: Send Counter Offer
  type: http
  seq: 3

http:
  method: POST
  url: "{{userUrl}}/order/offers"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "order_id": "22",
        "price": 140
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
docs: |-
  Send a counter offer on one of the authenticated user's pending orders. Returns the created offer (HTTP 201); invalid order/offer state returns HTTP 422.
  
  Request body (JSON):
  - `order_id` (integer, required): the user's order ID.
  - `price` (number, required): counter-offer price greater than zero.
  
  Requires the user bearer token and an order with an available driver offer.
