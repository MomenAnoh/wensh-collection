info:
  name: Get Order
  type: http
  seq: 5

http:
  method: GET
  url: "{{userUrl}}/orders/{{orderId}}"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/orders/{{orderId}}"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 27 Nov 2026 12:06:29 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "Order data loaded successfully.",
            "data": {
              "id": 7,
              "car_type_id": 1,
              "from_address": "tanta",
              "from_latitude": "30.0444000",
              "from_longitude": "31.2357000",
              "to_address": "cairo",
              "to_latitude": "30.0131000",
              "to_longitude": "31.2089000",
              "type": "scheduled",
              "status": "pending_for_payed",
              "scheduled_day": "2026-11-28",
              "scheduled_time": "14:30:00",
              "payment_methods": "online",
              "suggested_price": "0.00",
              "discount": "0.00",
              "app_fee": "0.00",
              "final_price": "150.00",
              "offers": [
                {
                  "id": 7,
                  "order_id": 7,
                  "made_from": "user",
                  "price": "150.00",
                  "fees": "0.00",
                  "total_price": "150.00",
                  "status": "pending_for_payed",
                  "user_id": 4,
                  "wensh_id": null,
                  "created_at": "2026-11-27T12:03:48.000000Z"
                }
              ]
            }
          }

docs: |-
  Get the full details and offers for the authenticated user's order. Requires the user bearer token.

  Path parameter:
  - `orderId` (integer, required): set the collection `orderId` variable to the order's ID.

  Returns HTTP 404 if the order does not exist or does not belong to the authenticated user.
