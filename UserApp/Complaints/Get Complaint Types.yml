info:
  name: Get Complaint Types
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/complaint-types"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns active complaint categories for users. Each item includes its id, localized name, and optional localized description.
