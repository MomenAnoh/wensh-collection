info:
  name: Get Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/user/profile"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
