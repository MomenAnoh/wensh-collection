info:
  name: Save Profile
  type: http
  seq: 2

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/user/profile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Ahmed Mohamed",
        "email": "ahmed@example.com",
        "emergency_contact_phone": "+201000000001"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
