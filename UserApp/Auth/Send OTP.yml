info:
  name: Send OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user/auth/otp/send"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone": "+201000000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
