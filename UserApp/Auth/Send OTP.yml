info:
  name: Send OTP
  type: http
  seq: 1

http:
  method: POST
  url: "{{userUrl}}/auth/otp/send"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone": "+201000000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/auth/otp/send"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
      body:
        type: json
        data: |-
          {
            "phone": "+201000000000"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-origin
          value: "*"
        - name: cache-control
          value: no-cache, private
        - name: content-type
          value: application/json
        - name: date
          value: Sat, 14 Nov 2026 13:06:14 GMT
        - name: host
          value: 7ea2-156-203-249-197.ngrok-free.app
        - name: ngrok-agent-ips
          value: 156.203.249.197
        - name: x-powered-by
          value: PHP/8.4.19
        - name: x-ratelimit-limit
          value: "10"
        - name: x-ratelimit-remaining
          value: "9"
        - name: x-robots-tag
          value: noindex, nofollow
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "message": "The verification code has been sent.",
            "data": {
              "expires_in": 300,
              "resend_after": 60,
              "otp": "123456"
            }
          }
docs: |-
  Send a one-time verification code to the user's phone.
  
  Request body (JSON):
  - `phone` (string, required): phone number with country code in E.164 format, for example `+201000000000` (a `+` followed by 8–15 digits).
  
  Rate limited to 10 requests per minute. Local/testing may return the OTP in `data.otp`; production may omit it. The response also includes `expires_in` and `resend_after`.
