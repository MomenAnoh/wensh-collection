info:
  name: Verify OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{userUrl}}/auth/otp/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone": "+201000000000",
        "code": "123456"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body?.data?.access_token || user_token
        method: jsonq
      variable:
        name: user_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/auth/otp/verify"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
      body:
        type: json
        data: |-
          {
            "phone": "+201000000000",
            "code": "123456"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 14 Nov 2026 11:30:36 GMT
        - name: content-type
          value: application/json
        - name: x-ratelimit-limit
          value: "10"
        - name: x-ratelimit-remaining
          value: "7"
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "The phone number was verified successfully.",
            "data": {
              "access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vMTI3LjAuMC4xOjgwMDAvYXBpL3YxL3VzZXIvYXV0aC9vdHAvdmVyaWZ5IiwiaWF0IjoxNzk0NjU1ODM2LCJuYmYiOjE3OTQ2NTU4MzYsImp0aSI6IktsYVRUQWZoaWNrRk9Mb0EiLCJzdWIiOiIxIiwicHJ2IjoiMjNiZDVjODk0OWY2MDBhZGIzOWU3MDFjNDAwODcyZGI3YTU5NzZmNyJ9.tOXM4enRTdZp4ynu3rAOguIooMMhjpvKtXPep798XB8",
              "token_type": "bearer",
              "expires_in": null,
              "user": {
                "id": 1,
                "phone": "+201000000000",
                "phone_verified_at": "2026-10-30T11:55:55.000000Z",
                "name": "Ahmed Mohamed",
                "email": "ahmed@example.com",
                "emergency_contact_phone": "+201000000001",
                "profile_photo_url": null,
                "profile_status": "completed",
                "notification_preferences": {
                  "requests": true,
                  "offers": true
                }
              }
            }
          }
docs: |-
  Verify the code sent to the user's phone. On success, returns `access_token`, `token_type`, `expires_in`, and the user object. The collection saves `data.access_token` as `user_token` for authenticated User API requests.
  
  Request body (JSON):
  - `phone` (string, required): the same E.164 phone used to send the OTP.
  - `code` (string, required): exactly 6 digits.
  
  Rate limited to 10 requests per minute.
