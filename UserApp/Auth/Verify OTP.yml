info:
  name: Verify OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user/auth/otp/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone": "+201000000000",
        "code": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
