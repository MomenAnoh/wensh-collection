info:
  name: Verify OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user/auth/otp/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone": "+201000000000",
        "code": "123456"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body?.data?.access_token || user_token
        method: jsonq
      variable:
        name: user_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{baseUrl}}/api/v1/user/auth/otp/verify"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
      body:
        type: json
        data: |-
          {
            "phone": "+201000000000",
            "code": "123456"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 30 Oct 2026 12:51:54 GMT
        - name: content-type
          value: application/json
        - name: x-ratelimit-limit
          value: "10"
        - name: x-ratelimit-remaining
          value: "8"
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
