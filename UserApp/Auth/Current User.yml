info:
  name: Current User
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/user/auth/me"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{baseUrl}}/api/v1/user/auth/me"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
        - name: Authorization
          value: Bearer {{accessToken}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 30 Oct 2026 13:02:11 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "User data loaded successfully.",
            "data": {
              "id": 1,
              "phone": "+201000000000",
              "phone_verified_at": "2026-10-30T11:55:55.000000Z",
              "name": "Ahmed Mohamed",
              "email": "ahmed@example.com",
              "emergency_contact_phone": "+201000000001",
              "profile_photo_url": null,
              "profile_status": "completed",
              "notification_preferences": {
                "requests": true,
                "offers": true
              }
            }
          }
