info:
  name: Current User
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/user/auth/me"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
