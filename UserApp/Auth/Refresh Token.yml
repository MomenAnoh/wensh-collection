info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{userUrl}}/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/auth/refresh"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer {{accessToken}}
    response:
      status: 200
      statusText: OK
      headers:
