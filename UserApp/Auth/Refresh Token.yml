info:
  name: Refresh Token
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user/auth/refresh"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{baseUrl}}/api/v1/user/auth/refresh"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer {{accessToken}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 30 Oct 2026 12:50:26 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
