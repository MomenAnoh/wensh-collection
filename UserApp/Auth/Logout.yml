info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/user/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{accessToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
