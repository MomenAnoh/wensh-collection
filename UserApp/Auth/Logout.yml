info:
  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{userUrl}}/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/auth/logout"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer {{accessToken}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 30 Oct 2026 12:45:36 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "You have been logged out.",
            "data": null
          }
docs: |-
  Log out the authenticated user and invalidate the current bearer token.
  
  Inputs: no query parameters or request body. Requires the user bearer token. The response returns `data: null`.
