info:
  name: Get Socket Ticket
  type: http
  seq: 3

http:
  method: GET
  url: "{{userUrl}}/chat/socket-ticket"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns a short-lived signed Socket.IO ticket and socket_url. Connect with auth.ticket, listen for chat_message_created, and refresh the ticket after it expires. Send messages through POST /chat/messages so Laravel persists and relays them.
