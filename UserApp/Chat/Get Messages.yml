info:
  name: Get Messages
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/chat/messages?page=1&per_page=50"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the authenticated user chat history. Messages are ordered chronologically within each page. Use page and per_page to paginate.
