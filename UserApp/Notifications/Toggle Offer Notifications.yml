info:
  name: Toggle Offer Notifications
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/user/notifications/offers"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    type: json
    data: |-
      {
        "enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
