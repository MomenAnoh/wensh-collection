info:
  name: Terms and Conditions
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/content/terms-and-conditions"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: example
    request:
      url: "{{userUrl}}/content/terms-and-conditions"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Accept-Language
          value: "{{locale}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: 127.0.0.1:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.4.19
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Fri, 30 Oct 2026 12:54:55 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "Content loaded successfully.",
            "data": {
              "title": "Terms and Conditions",
              "last_updated": "2026-10-01",
              "sections": [
                {
                  "title": "Using the service",
                  "body": "Wensh connects you with roadside service providers. You are responsible for providing an accurate location and vehicle details when placing a request."
                },
                {
                  "title": "Pricing and payment",
                  "body": "The price is shown before you confirm a request. Available payment methods are shown in the app before the service is completed."
                },
                {
                  "title": "Cancellation",
                  "body": "You may cancel a request according to its status and the cancellation policy displayed in the app. A cancellation fee may apply before cancellation is confirmed."
                }
              ]
            }
          }
