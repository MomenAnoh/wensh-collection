info:
  name: Terms and Conditions
  type: http
  seq: 1

http:
  method: GET
  url: "{{userUrl}}/content/terms-and-conditions"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the localized terms and conditions page with title, last_updated, and sections.
