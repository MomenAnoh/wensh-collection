info:
  name: Privacy Policy
  type: http
  seq: 2

http:
  method: GET
  url: "{{userUrl}}/content/privacy-policy"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the localized privacy policy with title, last_updated, and sections.
