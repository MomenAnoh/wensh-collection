info:
  name: FAQs
  type: http
  seq: 4

http:
  method: GET
  url: "{{userUrl}}/content/faqs"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns an ordered list of FAQs. Each item has id, question, and answer localized using Accept-Language (ar or en).
