info:
  name: FAQs
  type: http
  seq: 4

http:
  method: GET
  url: "{{driverUrl}}/content/faqs"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the ordered FAQ list for Wensh providers, localized using Accept-Language (ar or en). This endpoint is public.
