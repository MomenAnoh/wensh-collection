info:
  name: About Us
  type: http
  seq: 3

http:
  method: GET
  url: "{{driverUrl}}/content/about-us"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns the localized about page for Wensh providers. This endpoint is public.
