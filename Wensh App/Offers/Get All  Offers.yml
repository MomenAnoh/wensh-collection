info:
  name: Get All  Offers
  type: http
  seq: 4

http:
  method: GET
  url: "{{driverUrl}}/offers/all"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth:
    type: bearer
    token: "{{driver_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns a paginated list of offers created by all Wenshes.
