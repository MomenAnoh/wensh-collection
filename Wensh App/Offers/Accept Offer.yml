info:
  name: Accept Offer
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{driverUrl}}/offers/22/accept"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  auth:
    type: bearer
    token: "{{driver_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
