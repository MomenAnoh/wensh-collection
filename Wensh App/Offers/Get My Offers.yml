info:
  name: Get My Offers
  type: http
  seq: 3

http:
  method: GET
  url: "{{driverUrl}}/offers?page=1&per_page=15"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "15"
      type: query
    - name: filter
      value: completed
      type: query
      description: "Optional: completed or cancelled (filters by related order status). Omit to include all statuses."
      disabled: true
  auth:
    type: bearer
    token: "{{driver_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Returns paginated offers created by the authenticated Wensh.
  Query parameters:
  - `page` (integer, optional): page number; defaults to 1.
  - `per_page` (integer, optional): results per page; defaults to 15 and is limited to 1–50.
  - `filter` (optional): `completed` or `cancelled`, filtering by the related order status. Omit it to include all order statuses.
