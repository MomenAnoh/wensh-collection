info:
  name: Verify OTP Wensh
  type: http
  seq: 2

http:
  method: POST
  url: "{{driverUrl}}/auth/otp/verify"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone_code": "+20",
        "phone": "1000000000",
        "code": "123456"
      }
  auth: none

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body?.data?.access_token || ""
        method: jsonq
      variable:
        name: driver_token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body?.data?.registration_token || ""
        method: jsonq
      variable:
        name: wensh_registration_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Existing drivers receive an access token here. New phone numbers return registration_required=true and a registration_token; use that token in Register Wensh instead of entering the phone number again.
