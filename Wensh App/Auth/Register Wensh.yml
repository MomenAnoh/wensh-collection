info:
  name: Register Wensh
  type: http
  seq: 3

http:
  method: POST
  url: "{{driverUrl}}/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: multipart-form
    data:
      - name: registration_token
        type: text
        value: "{{wensh_registration_token}}"
        description: Token returned by Verify OTP Wensh; it identifies the verified phone.
      - name: full_name
        type: text
        value: "Test Driver"
      - name: email
        type: text
        value: "driver@example.com"
      - name: photo
        type: file
        value:
          - "./files/driver-photo.jpg"
        contentType: image/jpeg
        description: Select a JPG or PNG profile photo up to 5 MB.
      - name: license_image
        type: file
        value:
          - "./files/driver-license.jpg"
        contentType: image/jpeg
        description: Select a JPG, PNG, or PDF license image up to 5 MB.
      - name: truck_plate_number
        type: text
        value: "ABC-1234"
      - name: truck_image
        type: file
        value:
          - "./files/winch.jpg"
        contentType: image/jpeg
        description: Select a JPG or PNG winch photo up to 5 MB.
      - name: coverage_radius_km
        type: text
        value: "400"
        description: Maximum 400 km.
  auth: none

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body?.data?.access_token || ""
        method: jsonq
      variable:
        name: driver_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Submit the registration_token returned by Verify OTP Wensh and the registration details as multipart form-data. The verified phone number is read from the token; do not enter it again. The token expires with the OTP verification (5 minutes) and can only be used once.
  
  Replace each sample file path with a real local JPG, PNG, or PDF file. New accounts are created pending admin review.
