info:
  name: Send OTP Wensh
  type: http
  seq: 1

http:
  method: POST
  url: "{{driverUrl}}/auth/otp/send"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: "{{locale}}"
  body:
    type: json
    data: |-
      {
        "phone_code": "+20",
        "phone": "1000000000"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Send a one-time code to the driver's phone. Local/testing returns the fixed OTP in the response.
